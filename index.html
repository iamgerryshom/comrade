<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#116a3f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Comrade" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Comrade: official Kisii University notices for students and staff, with SMS fallback when you're offline." />
    <title>Comrade</title>
  </head>
  <body>
    <style>
      html.dark body { background: #121c18; color: #eef3f0 }
    </style>
    <script>
      try {
        var t = localStorage.getItem('comrade.theme') || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <div id="root">
      <!-- Instant splash: painted before any JavaScript runs -->
      <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,'Segoe UI',Roboto,sans-serif">
        <svg viewBox="0 0 32 32" width="56" height="56" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#116a3f"/><path d="M21.5 11.2a7 7 0 1 0 0 9.6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><circle cx="24" cy="8" r="3.6" fill="#e5a823" stroke="#116a3f" stroke-width="1.5"/></svg>
        <p style="margin:0;font-size:22px;font-weight:700;letter-spacing:-0.02em">Comrade</p>
        <p style="margin:0;font-size:14px;opacity:.65">Never miss a class update, even offline.</p>
      </div>
    </div>
    <noscript>Comrade needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
